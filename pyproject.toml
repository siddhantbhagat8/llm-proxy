[project]
name = "llm-proxy"
version = "0.1.0"
description = "OpenAI-compatible LLM proxy with per-user usage tracking, billing, and limits"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi==0.141.1",
    "httpx==0.28.1",
    "uvicorn[standard]==0.52.3",
]

[dependency-groups]
dev = [
    "openai==3.1.0",
    "pyright==1.1.411",
    "pytest==9.1.1",
    "ruff==0.16.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.pyright]
include = ["app", "tests"]
